name: create and push docker image

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths-ignore:
      - "README.md"
      - .github/workflows/lint-test-helm.yaml
      - .github/workflows/tests.yaml
      - .github/workflows/release-helm.yaml
      - helm/

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postfix: ""
            features: ""
          - postfix: "-face"
            features: "--features face_recognition"
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: set build platforms
        id: platforms
        run: |
          if [[ "${{ github.event_name }}" == "push" && {{is_default_branch}} ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
      - name: log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tag
        uses: actions/github-script@v7
        id: compute-tag
        with:
          result-encoding: string
          script: |
            if (context.eventName === "pull_request") {
              return "pr-" + context.issue.number + "${{ matrix.postfix }}";
            }
            if (context.eventName === "release") {
              return "latest" + "${{ matrix.postfix }}";
            }
            if (context.eventName === "push") {
              if (context.ref.startsWith("refs/tags/")) {
                return context.ref.slice(10) + "${{ matrix.postfix }}";
              }
              if (context.ref === "refs/heads/main") {
                return "nightly" + "${{ matrix.postfix }}";
              }
            }
            return "FALSE";
      - name: extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{date 'YYYYMMDD-hhmmss' tz='Europe/Berlin'}}
            type=ref,event=pr
            type=sha
            type=raw,value=${{ steps.compute-tag.outputs.result }}
            type=raw,value=nightly,enable={{is_default_branch}}
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          build-args: |
            featureflag=${{ matrix.features }}
            CMAKE_POLICY_VERSION_MINIMUM=3.5
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min